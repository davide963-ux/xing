<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>.step{display:flex;align-items:center;gap:36px;background:rgba(0,0,0,.32);border:2px solid rgba(255,255,255,.18);border-radius:36px;padding:20px 36px;width:100%}
.n{flex:none;width:96px;height:96px;border-radius:50%;background:#f2c14e;color:#2b2100;font-weight:900;font-size:60px;display:grid;place-items:center}
.step>div>b{font-size:50px;display:block}.step>div>span{font-size:38px;color:#cfe6da;line-height:1.25}
.step>div:nth-child(2){flex:1}
.mini{display:flex;flex:none}.mini .c{width:110px;height:154px;border-radius:12px}
.mini .c .k{font-size:34px}.mini .c .k small{font-size:28px}.mini .c .m{font-size:64px}.mini .c .ms{display:none}.mini .c+.c{margin-left:-40px}
.mini .c .tl{top:8px;left:10px}.mini .c .br{bottom:8px;right:10px}</style>
<body><div class="suits"></div>
<div class="wrap">
 <div class="kicker">Learn in 30 seconds</div>
 <h1 style="margin:20px 0 34px">How to <em>win</em> at XING</h1>
 <div style="display:flex;flex-direction:column;gap:22px;width:100%">
  <div class="step"><div class="n">1</div><div><b>Match the top card</b><span>Same rank captures the whole pile.</span></div><div class="mini"><div class="c" data-r="9" data-s="C"></div><div class="c" data-r="9" data-s="H"></div></div></div>
  <div class="step"><div class="n">2</div><div><b>Jacks take everything</b><span>A jack captures any pile.</span></div><div class="mini"><div class="c" data-r="J" data-s="S"></div></div></div>
  <div class="step"><div class="n">3</div><div><b>Lone card? Xing!</b><span>Capture a single card with its twin: +10</span></div><div class="mini"><div class="c" data-r="8" data-s="D"></div><div class="c" data-r="8" data-s="C"></div></div></div>
  <div class="step"><div class="n">★</div><div><b>Aces, jacks, 10♦, 2♣ score</b><span>First to 101 points wins the match.</span></div></div>
 </div>
 <div class="spacer"></div>
 <div class="url" style="margin-top:28px">luajxing.com</div>
</div>
<script src="cards.js"></script>
